const nav = document.getElementById('nav');
window.addEventListener('scroll', () => { nav.classList.toggle('scrolled', window.scrollY > 40); }, {passive:true});
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');
let menuOpen = false;
hamburger.addEventListener('click', () => { menuOpen = !menuOpen; mobileMenu.classList.toggle('open', menuOpen); hamburger.setAttribute('aria-expanded', menuOpen); });
document.querySelectorAll('.mob-link').forEach(l => { l.addEventListener('click', () => { menuOpen = false; mobileMenu.classList.remove('open'); }); });
const reveals = document.querySelectorAll('.reveal');
const revealObs = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); revealObs.unobserve(entry.target); } }); }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
reveals.forEach(el => revealObs.observe(el));
document.querySelectorAll('.faq-q').forEach(btn => { btn.addEventListener('click', () => { const item = btn.closest('.faq-item'); const wasOpen = item.classList.contains('open'); document.querySelectorAll('.faq-item.open').forEach(el => { el.classList.remove('open'); el.querySelector('.faq-q').setAttribute('aria-expanded', 'false'); }); if (!wasOpen) { item.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); } }); });
document.querySelectorAll('a[href^="#"]').forEach(a => { a.addEventListener('click', e => { const id = a.getAttribute('href'); const target = id === '#' ? document.body : document.querySelector(id); if (target) { e.preventDefault(); window.scrollTo({ top: id === '#' ? 0 : target.offsetTop - 78, behavior: 'smooth' }); if (menuOpen) { menuOpen = false; mobileMenu.classList.remove('open'); } } }); });
<\/script>
